<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parking Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">Smart Parking</div>
    </header>

    <div class="container">
        <h1>Find Parking Spots in Hyderabad</h1>

        <!-- Search and Button Section -->
        <section id="search-section">
            <input type="text" id="location-input" placeholder="Enter your destination (e.g. Banjara Hills)" />
            <button onclick="findParking()">Search Parking</button>
        </section>

        <!-- Map Section -->
        <section id="map-section">
            <div id="map"></div>
        </section>
    </div>

    <script src="script.js"></script>
    <!-- Google Maps JavaScript API -->
    <script async
        src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap&libraries=places">
    </script>
</body>
</html>
