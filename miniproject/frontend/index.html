<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parking Route Finder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      background-color: #f0f0f0;
    }

    h2 {
      color: #4CAF50;
      font-size: 2em;
      margin-bottom: 20px;
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
    }

    #map {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .search-container {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 500px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 10px 20px;
      border-radius: 25px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    }

    #locationInput {
      width: 75%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 25px;
      outline: none;
    }

    #locationInput:focus {
      border-color: #4CAF50;
    }

    #searchBtn {
      background-color: #4CAF50;
      color: white;
      font-size: 16px;
      padding: 10px 15px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    #searchBtn:hover {
      background-color: #45a049;
    }

    #loadingMessage {
      font-size: 16px;
      color: #ff9800;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      display: none;
    }

    .location-list {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 500px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
      max-height: 300px;
      overflow-y: scroll;
      z-index: 1001;
    }

    .location-item {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      cursor: pointer;
    }

    .location-item:hover {
      background-color: #f1f1f1;
    }

    @media (max-width: 768px) {
      .search-container {
        width: 90%;
      }

      #locationInput {
        width: 80%;
      }
    }
  </style>
</head>
<body>

  <h2>Parking Route Finder</h2>

  <div class="search-container">
    <input type="text" id="locationInput" placeholder="Enter parking location (e.g., Banjara Hills)" />
    <button id="searchBtn">🔍</button>
  </div>

  <div id="loadingMessage">Loading your location...</div>

  <div id="map"></div>
  <div id="locationList" class="location-list" style="display:none;"></div>

  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

  <script>
    let map, userLocation, parkingLocation, routeControl;
    let userMarker, parkingMarker, locationMarkers = [];

    // Initialize the map
    function initMap() {
      map = L.map('map', {
        zoomControl: true,
        dragging: true,
        scrollWheelZoom: true,
        touchZoom: true
      }).setView([17.4046, 78.4478], 14); // Default to Hyderabad, India

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19
      }).addTo(map);
    }

    // Function to get user location and nearby parking spots
    function getUserLocationAndNearby() {
      document.getElementById("loadingMessage").style.display = "block"; // Show loading message

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function (position) {
          userLocation = [position.coords.latitude, position.coords.longitude];

          if (userMarker) {
            map.removeLayer(userMarker); // Remove previous user marker
          }

          // Add user location marker
          userMarker = L.marker(userLocation).addTo(map)
            .bindPopup("Your Location")
            .openPopup();

          const parkingLocationInput = document.getElementById("locationInput").value;

          // Geocode parking location
          geocodeLocation(parkingLocationInput);
        }, function (error) {
          alert("Error getting location: " + error.message);
          document.getElementById("loadingMessage").style.display = "none";
        });
      } else {
        alert("Geolocation is not supported by this browser.");
        document.getElementById("loadingMessage").style.display = "none";
      }
    }

    // Geocode the parking location and find nearby spots
    function geocodeLocation(location) {
      const geocodeUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(location)}&addressdetails=1`;

      fetch(geocodeUrl)
        .then(response => response.json())
        .then(data => {
          if (data.length > 0) {
            parkingLocation = [data[0].lat, data[0].lon];

            // Smoothly pan and zoom to the searched location
            map.flyTo(parkingLocation, 14, { animate: true, duration: 2 }); // Smooth zoom and pan

            // Add marker to the searched location
            if (parkingMarker) {
              map.removeLayer(parkingMarker); // Remove previous marker
            }
            parkingMarker = L.marker(parkingLocation).addTo(map)
              .bindPopup(data[0].display_name)
              .openPopup();

            // Show route to the searched location
            getRoute(userLocation, parkingLocation);
          } else {
            alert("Parking location not found. Please enter a valid location.");
            document.getElementById("loadingMessage").style.display = "none";
          }
        })
        .catch(error => {
          alert("Error geocoding location: " + error);
          document.getElementById("loadingMessage").style.display = "none";
        });
    }

    // Find nearby parking locations and show them
    function displayNearbyLocations(location) {
      const nearbySearchUrl = `https://nominatim.openstreetmap.org/search?format=json&lat=${location[0]}&lon=${location[1]}&radius=1000&addressdetails=1&limit=5`;

      fetch(nearbySearchUrl)
        .then(response => response.json())
        .then(data => {
          const locationList = document.getElementById("locationList");
          locationList.innerHTML = ""; // Clear previous results

          if (data.length > 0) {
            data.forEach(place => {
              const lat = place.lat;
              const lon = place.lon;
              const distance = getDistance(location, [lat, lon]);

              const listItem = document.createElement("div");
              listItem.classList.add("location-item");
              listItem.textContent = place.display_name;
              listItem.addEventListener("click", function () {
                // When a user clicks a location, it should show the route
                getRoute(location, [lat, lon]);
              });

              locationList.appendChild(listItem);
            });
            locationList.style.display = "block";
          } else {
            locationList.innerHTML = "<div>No nearby parking spots found.</div>";
            locationList.style.display = "block";
          }

          document.getElementById("loadingMessage").style.display = "none";
        })
        .catch(error => {
          alert("Error fetching nearby locations: " + error);
          document.getElementById("loadingMessage").style.display = "none";
        });
    }

    // Calculate the distance between two coordinates (in meters)
    function getDistance(coord1, coord2) {
      const lat1 = coord1[0], lon1 = coord1[1];
      const lat2 = coord2[0], lon2 = coord2[1];
      const R = 6371; // Earth radius in km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      const distance = R * c * 1000; // distance in meters
      return distance;
    }

    // Get the route from the user's location to the selected parking location
    function getRoute(userLoc, parkingLoc) {
      if (routeControl) {
        map.removeControl(routeControl); // Remove previous route
      }

      routeControl = L.Routing.control({
        waypoints: [
          L.latLng(userLoc[0], userLoc[1]),
          L.latLng(parkingLoc[0], parkingLoc[1])
        ],
        routeWhileDragging: true
      }).addTo(map);

      // Zoom into the route
      map.flyTo(userLoc, 14);
    }

    // Listen for search button click
    document.getElementById("searchBtn").addEventListener("click", function () {
      getUserLocationAndNearby();
    });

    // Initialize the map on page load
    initMap();
  </script>
</body>
</html>
