<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parking Route Finder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>
  <style>
    body, html {
      height: 100%;
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(to right, #4CAF50, #81C784);
    }

    #map {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .search-container {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 600px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.9);
      padding: 15px;
      border-radius: 50px;
      box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.2);
    }

    #locationInput {
      width: 80%;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 30px;
      outline: none;
      box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.1);
    }

    #locationInput:focus {
      border: 2px solid #4CAF50;
    }

    #searchBtn {
      background-color: #4CAF50;
      color: white;
      font-size: 18px;
      padding: 12px 15px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
    }

    #searchBtn:hover {
      background-color: #388E3C;
      transform: scale(1.1);
    }

    .map-buttons {
      position: absolute;
      top: 100px;
      right: 20px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .satellite-btn, .traffic-btn {
      background-color: #388E3C;
      color: white;
      font-size: 24px;
      border: none;
      padding: 12px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
    }

    .satellite-btn:hover, .traffic-btn:hover {
      background-color: #2C6F28;
      transform: scale(1.1);
    }

    .traffic-btn {
      background-color: #FF9800;
    }

    .traffic-btn:hover {
      background-color: #F57C00;
    }

  </style>
</head>
<body>

  <div class="search-container">
    <input type="text" id="locationInput" placeholder="Search for parking spots or places..." />
    <button id="searchBtn"><i class="fas fa-search"></i></button>
  </div>

  <!-- Map buttons (Satellite View & Traffic Density) positioned outside the map -->
  <div class="map-buttons">
    <button class="satellite-btn" id="satelliteViewBtn"><i class="fas fa-globe"></i></button>
    <button class="traffic-btn" id="trafficLayerBtn"><i class="fas fa-car-crash"></i></button>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
  <script>
    let map, userLocation, routeControl;
    let userMarker, parkingMarker;
    let baseLayer, satelliteLayer, trafficLayer;
    const MAPBOX_ACCESS_TOKEN = 'your-mapbox-access-token-here'; // Replace with your Mapbox access token

    // Custom icon for user location
    const userIcon = L.icon({
      iconUrl: 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/svgs/solid/user-location.svg',
      iconSize: [30, 30],
      iconAnchor: [15, 30],
      popupAnchor: [0, -30]
    });

    // Custom icon for parking spot
    const parkingIcon = L.icon({
      iconUrl: 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/svgs/solid/location-pin.svg',
      iconSize: [30, 30],
      iconAnchor: [15, 30],
      popupAnchor: [0, -30]
    });

    // Initialize the map
    function initMap() {
      map = L.map('map', {
        zoomControl: true,
        dragging: true,
        scrollWheelZoom: true,
        touchZoom: true
      }).setView([17.4046, 78.4478], 14); // Default to Hyderabad, India

      // Add OpenStreetMap base layer
      baseLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19
      }).addTo(map);

      // Add Esri World Imagery (Satellite) base layer
      satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: '&copy; <a href="https://www.esri.com/en-us/arcgis/products/arcgis-online">Esri</a> contributors',
        maxZoom: 19
      });

      // Add Mapbox Traffic Layer
      trafficLayer = L.tileLayer(`https://api.mapbox.com/styles/v1/mapbox/traffic-day-v2/tiles/{z}/{x}/{y}?access_token=${MAPBOX_ACCESS_TOKEN}`, {
        attribution: '&copy; <a href="https://www.mapbox.com/about/maps/">© Mapbox</a>',
        maxZoom: 19,
        id: 'mapbox.traffic',
        tileSize: 512,
        zoomOffset: -1
      });

      // Try to get user's location on page load
      getUserLocation();
    }

    // Function to get user location
    function getUserLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function (position) {
          userLocation = [position.coords.latitude, position.coords.longitude];

          if (userMarker) {
            map.removeLayer(userMarker); // Remove previous user marker
          }

          // Add user location marker
          userMarker = L.marker(userLocation, { icon: userIcon }).addTo(map)
            .bindPopup("Your Location")
            .openPopup();

          // Zoom to user's location
          map.flyTo(userLocation, 14, { animate: true, duration: 2 });

        }, function (error) {
          alert("Error getting location: " + error.message);
        });
      } else {
        alert("Geolocation is not supported by this browser.");
      }
    }

    // Geocode the searched location
    function geocodeLocation(location) {
      const geocodeUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(location)}&addressdetails=1&accept-language=en`;

      fetch(geocodeUrl)
        .then(response => response.json())
        .then(data => {
          if (data.length > 0) {
            const searchLocation = [data[0].lat, data[0].lon];
            displayRoute(searchLocation, data[0].display_name);
          } else {
            alert("Location not found. Please enter a valid address.");
          }
        });
    }

    // Show route to searched location
    function displayRoute(destination, placeName) {
      if (parkingMarker) {
        map.removeLayer(parkingMarker); // Remove previous destination marker
      }

      // Add parking spot marker
      parkingMarker = L.marker(destination, { icon: parkingIcon }).addTo(map)
        .bindPopup("Parking Spot: " + placeName)
        .openPopup();

      // Create a route to the searched location
      if (routeControl) {
        routeControl.setWaypoints([userLocation, destination]); // Update the route
      } else {
        routeControl = L.Routing.control({
          waypoints: [userLocation, destination],
          routeWhileDragging: true
        }).addTo(map);
      }

      // Zoom and pan to the new route
      map.flyTo(destination, 14, { animate: true, duration: 2 });
    }

    // Add event listener for search button
    document.getElementById('searchBtn').addEventListener('click', function () {
      const location = document.getElementById('locationInput').value;
      if (location) {
        geocodeLocation(location);
      }
    });

    // Satellite View toggle button functionality
    document.getElementById("satelliteViewBtn").addEventListener("click", function() {
      if (map.hasLayer(satelliteLayer)) {
        map.removeLayer(satelliteLayer);
        map.addLayer(baseLayer);
        this.innerHTML = '<i class="fas fa-globe"></i>'; // Change button back
      } else {
        map.addLayer(satelliteLayer);
        map.removeLayer(baseLayer);
        this.innerHTML = '<i class="fas fa-satellite"></i>'; // Change button to Satellite View
      }
    });

    // Traffic Layer toggle button functionality
    document.getElementById("trafficLayerBtn").addEventListener("click", function() {
      if (map.hasLayer(trafficLayer)) {
        map.removeLayer(trafficLayer);
        this.innerHTML = '<i class="fas fa-car-crash"></i>'; // Change button back
      } else {
        map.addLayer(trafficLayer);
        this.innerHTML = '<i class="fas fa-traffic-light"></i>'; // Change button to show traffic layer active
      }
    });

    // Initialize the map
    initMap();
  </script>
</body>
</html>
